name: Actions Shells
description: "More shells for 'run:' — use Rust, Go, Deno, Bun, Kotlin, Swift, C#, and more as 'shell:' in GitHub Actions steps"
author: Kaj Kowalski
branding: { icon: terminal, color: gray-dark }

inputs:
  doctor:
    description: Run `actions-shell doctor` after install and print a readiness report
    required: false
    default: "false"
  runtimes:
    description: >-
      Comma- or space-separated runtimes that must be ready when `doctor` is enabled.
      The step fails if any of them is missing. Empty means "report all, fail none".
    required: false
    default: ""

outputs:
  bin-dir: { description: Directory containing the 'actions-shell' shim (already added to PATH) }
  cli: { description: Absolute path to the bundled cli.js }
  version: { description: Installed actions-shell version }

runs: { using: node24, main: setup.js }
