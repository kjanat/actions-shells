name: Release

# Source lives on master. A release is an orphan commit containing only
# README.md, LICENSE, action.yml, cli.mjs and setup.mjs, tagged vX.Y.Z (immutable),
# with vX.Y and vX moved to point at it. Built files are attested and attached
# to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, no leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release (floating tags are NOT moved)"
        required: false
        type: boolean
        default: false

permissions: { contents: write, id-token: write, attestations: write }
concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with: { ref: master, fetch-depth: 0 }
          - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
            with: { node-version: 24, package-manager-cache: false }
          - uses: kjanat/runner@6e752d37c4b3de6bda86c89b2f5bc487097425cd # master
      - name: Validate version
        id: v
        env: { VERSION: "${{ inputs.version }}", PRERELEASE: "${{ inputs.prerelease }}" }
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: ${VERSION}"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists — release tags are immutable"; exit 1
          fi
          [[ -n "${BASH_REMATCH[4]:-}" || "${PRERELEASE}" == "true" ]] && PRERELEASE=true || PRERELEASE=false
          export PRERELEASE
          {
            echo "version=${VERSION}"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "ACTIONS_SHELL_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: runner i -pf lint typecheck
      - run: run build
        env: { ACTIONS_SHELL_VERSION: "${{ steps.v.outputs.version }}" }
      - parallel:
          - run: run test:unit
          - run: run vitest run test/integration
      - run: run scripts/assemble-release.ts release

      - name: Checksums
        working-directory: release
        run: sha256sum cli.mjs setup.mjs action.yml > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/cli.mjs
            release/setup.mjs
            release/action.yml

      - name: Create orphan release commit and tags
        id: tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MAJOR: ${{ steps.v.outputs.major }}
          MINOR: ${{ steps.v.outputs.minor }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build a tree from release/ only, using a throwaway index so master's tree is untouched.
          GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_INDEX_FILE
          git --work-tree=release add -A
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE

          HEAD="$(git rev-parse HEAD)"
          COMMIT="$(git commit-tree "${TREE}" -m "actions-shells v${VERSION}" -m "Built from ${HEAD} on master.")"
          git tag -a "v${VERSION}" -m "actions-shells v${VERSION}" "${COMMIT}"
          git push origin "refs/tags/v${VERSION}"

          if [[ "${PRERELEASE}" != "true" ]]; then
            git tag -f -a "v${MAJOR}.${MINOR}" -m "actions-shells v${MAJOR}.${MINOR} -> v${VERSION}" "${COMMIT}"
            git tag -f -a "v${MAJOR}" -m "actions-shells v${MAJOR} -> v${VERSION}" "${COMMIT}"
            git push --force origin "refs/tags/v${MAJOR}.${MINOR}" "refs/tags/v${MAJOR}"
          fi
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Package
        env: { VERSION: "${{ steps.v.outputs.version }}" }
        run: |
          set -euo pipefail
          tar -C release -czf "actions-shells-v${VERSION}.tgz" README.md LICENSE action.yml cli.mjs setup.mjs
          cp release/SHA256SUMS release/cli.mjs release/setup.mjs .

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            actions-shells-v${{ steps.v.outputs.version }}.tgz
            cli.mjs
            setup.mjs
            SHA256SUMS
