name: Release

# Beepboop selects the version and source; this workflow publishes npmjs.org, GitHub Packages
# and the built Action on the actions branch, then reports both results.
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Approved Beepboop promotion execution
        required: true
        type: string
      beepboop_title:
        description: Beepboop run title
        required: false
        type: string

permissions: { contents: write, id-token: write, attestations: write, packages: write }
concurrency: { group: release, cancel-in-progress: false }
defaults: { run: { shell: "bash -euo pipefail {0}" } }

jobs:
  release:
    runs-on: ubuntu-slim
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: actions-shells
          operation: promote
      - uses: kjanat/beepboop/actions/token@v1
        id: beepboop
        with:
          execution-id: ${{ steps.release.outputs.execution-id }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          fetch-depth: 0
          token: ${{ steps.beepboop.outputs.token }}
      - parallel:
          - uses: kjanat/runner@26ceb1f678c11e79d1846b7aa5f8d61af7ecdf65 # master
          - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
            with: { cache: true, install: false }
      - name: Release metadata
        id: v
        env: { VERSION: "${{ fromJSON(steps.release.outputs.context).version }}" }
        run: |
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          [[ "${VERSION}" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          [[ "${prerelease}" == true ]] && channel=next || channel=latest
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "ACTIONS_SHELL_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - run: runner i -pf lint typecheck
      - name: Set package version
        env: { VERSION: "${{ steps.v.outputs.version }}" }
        run: pnpm pkg set "version=${VERSION}"
      - run: run build
        env: { ACTIONS_SHELL_VERSION: "${{ steps.v.outputs.version }}" }
      - parallel:
          - run: run test:unit
          - run: run vitest run test/integration
      - run: run scripts/assemble-release.ts release

      - name: Checksums
        run: sha256sum cli.mjs setup.mjs action.yml | tee SHA256SUMS release/SHA256SUMS

      - name: Pack npm package
        id: package
        run: |
          npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}" > "${RUNNER_TEMP}/npm-pack.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pkg] = Object.values(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${join(process.env.RUNNER_TEMP, pkg.filename)}\nintegrity=${pkg.integrity}\n`);
          JS

      - name: npm credentials
        id: npm_credentials
        uses: kjanat/beepboop/actions/credentials@v1
        with:
          execution-id: ${{ steps.release.outputs.execution-id }}
          aliases: '["npm-token"]'

      - name: Publish to npmjs.org
        id: npm
        env:
          "npm_config_//registry.npmjs.org/:_authToken": ${{ fromJSON(steps.npm_credentials.outputs.values)['npm-token'] }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: npm publish "${TARBALL}" --registry=https://registry.npmjs.org --access=public --provenance --tag="${CHANNEL}"

      - name: Publish to GitHub Packages
        id: github_packages
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          "npm_config_//npm.pkg.github.com/:_authToken": ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: npm publish "${TARBALL}" --registry=https://npm.pkg.github.com --access=public --tag="${CHANNEL}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/cli.mjs
            release/setup.mjs
            release/action.yml

      - name: Publish Action commit and tags
        id: tag
        env:
          "${{ insert }}": ${{ fromJSON(steps.beepboop.outputs.gitId || '{}') }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: bash scripts/publish-action.sh

      - name: Package
        env: { VERSION: "${{ steps.v.outputs.version }}" }
        run: tar -C release -czf "actions-shells-v${VERSION}.tgz" README.md LICENSE action.yml cli.mjs setup.mjs;
          cp release/SHA256SUMS release/cli.mjs release/setup.mjs .

      - name: GitHub Release
        id: github_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ steps.beepboop.outputs.token }}
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            actions-shells-v${{ steps.v.outputs.version }}.tgz
            cli.mjs
            setup.mjs
            SHA256SUMS

      - name: Report publications
        if: ${{ always() && steps.release.outcome == 'success' }}
        uses: kjanat/beepboop/actions/report@v1
        with:
          execution-id: ${{ steps.release.outputs.execution-id }}
          publications: >-
            [{"id":"pkg:npm/%40kjanat/actions-shells","manager":"npm","name":"@kjanat/actions-shells",
              "version":"${{ fromJSON(steps.release.outputs.context).version }}",
              "digest":"${{ steps.package.outputs.integrity }}","channel":"${{ steps.v.outputs.channel }}",
              "outcome":"${{ steps.npm.outcome == 'success' && 'succeeded' || 'failed' }}","required":true},
             {"id":"workflow:github-packages","manager":"workflow","name":"github-packages",
              "version":"${{ fromJSON(steps.release.outputs.context).version }}",
              "outcome":"${{ steps.github_packages.outcome == 'success' && 'succeeded' || 'failed' }}","required":true},
             {"id":"workflow:action-release","manager":"workflow","name":"action-release",
              "version":"${{ fromJSON(steps.release.outputs.context).version }}",
              "outcome":"${{ steps.tag.outcome == 'success' && steps.github_release.outcome == 'success' && 'succeeded' || 'failed' }}","required":true}]
