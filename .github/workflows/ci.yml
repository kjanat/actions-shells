name: CI

on:
  push: { branches: ["**"] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    name: lint, typecheck and unit
    runs-on: ubuntu-latest
    steps:
      - uses: &Checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel: &PnpmRunner
          - uses: &Pnpm pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
            with: { cache: true, install: false }
          - uses: kjanat/runner@26ceb1f678c11e79d1846b7aa5f8d61af7ecdf65 # master
      - run: runner i -pf lint typecheck build test:unit release:assemble
      - uses: *Pnpm
        with: { runtime: node@24, install: false }
      - name: verify standalone bundles on the action's Node 24 runtime
        run: node node_modules/vitest/vitest.mjs run test/integration/setup.test.ts

  e2e:
    name: e2e (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    steps:
      - uses: *Checkout
      - parallel: *PnpmRunner
      - run: runner i -f build

      # runtimes (this action does not install any of these on purpose)
      - uses: &RustStable dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - run: rustup default stable
        shell: bash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/rust-script
            ~/Library/Caches/rust-script
            ~\AppData\Local\rust-script
          key: "rust-script-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}"
      - uses: &TaikiE taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with: &RustScript { tool: rust-script }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: stable, cache: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: v2.x }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.x" }
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with: { ruby-version: "3.4" }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.4" }
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with: { version: "1" }
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with: { use-public-rspm: true }
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          mise_toml: |
            [tools]
            java = "21"
            kotlin = "2.4.21"
            ${{ runner.os != 'Windows' && 'lua = "5.4"' || '' }}
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with: { perl-version: "5" }

      # integration tests spawn cli.mjs against every runtime found on PATH
      - { run: run -- vitest run test/integration, shell: bash }

      # the real thing: use the action from this checkout, then `shell:` steps
      - { uses: ./, with: { doctor: true } }

      - name: rust-script
        shell: actions-shell rust-script {0}
        run: println!("Ferris has entered CI on {}", std::env::consts::OS);

      - name: rust-script with embedded cargo manifest
        shell: actions-shell rust {0}
        run: |
          //! ```cargo
          //! [dependencies]
          //! serde_json = "1"
          //! ```
          fn main() {
            let value: serde_json::Value = serde_json::from_str(r#"{"hello":"world"}"#).unwrap();
            println!("{value}");
          }

      - name: cargo -Zscript
        shell: actions-shell cargo-script {0}
        run: |
          ---cargo
          [package]
          edition = "2024"
          ---
          fn main() {
            println!("cargo script says hi");
          }

      - name: go
        shell: actions-shell go {0}
        run: |
          package main

          import (
            "fmt"
            "os"
          )

          func main() {
            fmt.Println("go says hi from", os.Getenv("RUNNER_OS"))
          }

      - name: deno
        shell: actions-shell deno {0}
        run: |
          const sha: string = Deno.env.get("GITHUB_SHA") ?? "";
          console.log("deno", Deno.version.deno, sha.slice(0, 7));

      - name: bun
        shell: actions-shell bun {0}
        run: |
          const n: number = 42;
          console.log("bun", Bun.version, n);

      - name: node
        shell: actions-shell node {0}
        run: console.log("node", process.version, process.env.GITHUB_REPOSITORY);

      - name: csharp
        shell: actions-shell csharp {0}
        run: Console.WriteLine($"C# on {Environment.OSVersion.Platform}");

      - name: fsharp
        shell: actions-shell fsharp {0}
        run: printfn "F# says hi"

      - name: kotlin
        shell: actions-shell kotlin {0}
        run: println("kotlin says hi from ${System.getenv("RUNNER_OS")}")

      - name: swift
        if: runner.os == 'macOS' # macOS runners ship Swift; no setup action needed
        shell: actions-shell swift {0}
        run: print("swift says hi")

      - name: python
        shell: actions-shell python {0}
        run: |
          import sys

          print("python", sys.version.split()[0])

      - name: ruby
        shell: actions-shell ruby {0}
        run: 'puts "ruby #{RUBY_VERSION}"'

      - name: perl
        shell: actions-shell perl {0}
        run: print "perl $^V\n";

      - name: php
        shell: actions-shell php {0}
        run: <?php echo "php " . PHP_VERSION . "\n";

      - name: lua
        if: runner.os != 'Windows'
        shell: actions-shell lua {0}
        run: print("lua " .. _VERSION)

      - name: julia
        shell: actions-shell julia {0}
        run: println("julia ", VERSION)

      - name: r
        shell: actions-shell r {0}
        run: cat("R", R.version.string, "\n")

      - name: runtime args before {0}
        shell: actions-shell deno --no-check {0}
        run: console.log("deno --no-check works");

      - name: exit codes propagate
        id: fail
        continue-on-error: true
        shell: actions-shell go {0}
        run: |
          package main
          import "os"
          func main() { os.Exit(3) }

      - name: assert the previous step failed
        shell: bash
        env: { FAIL_OUTCOME: "${{ steps.fail.outcome }}" }
        run: test "${FAIL_OUTCOME}" = "failure"

  e2e-job-default:
    name: job-wide default shell
    needs: check
    runs-on: ubuntu-latest
    defaults: { run: { shell: "actions-shell rust-script {0}" } }
    steps:
      - uses: *Checkout
      - parallel: *PnpmRunner
      - { run: runner i -f build, shell: bash }
      - uses: *RustStable
      - uses: *TaikiE
        with: *RustScript
      - uses: ./
      - run: println!("every run block is Rust now");
      - run: |
          use std::process::Command;

          let status = Command::new("cargo").arg("--version").status().unwrap();
          std::process::exit(status.code().unwrap_or(1));

  e2e-cross:
    name: cross (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, arch: aarch64 }
          - { target: x86_64-unknown-linux-musl, arch: x86_64 }
    steps:
      - uses: *Checkout
      - parallel: *PnpmRunner
      - run: runner i -f build
      - uses: *RustStable
      - uses: *TaikiE
        with: { tool: "cross@0.2.5,rust-script@0.36.0" }
      - run: pnpm exec vitest run test/integration/cross.test.ts
        env:
          ACTIONS_SHELL_TEST_CROSS: "1"
          ACTIONS_SHELL_TEST_CROSS_TARGET: ${{ matrix.target }}
      - { uses: ./, with: { doctor: true, runtimes: cross } }
      - name: inline ARM64 shell and GitHub output
        if: matrix.arch == 'aarch64'
        id: cross-arm64
        shell: actions-shell cross --target aarch64-unknown-linux-gnu {0}
        run: &CrossOutput |
          use std::io::Write;
          let mut output = std::fs::OpenOptions::new()
              .append(true)
              .open(std::env::var("GITHUB_OUTPUT").unwrap())
              .unwrap();
          writeln!(output, "arch={}", std::env::consts::ARCH).unwrap();
      - name: inline musl shell and GitHub output
        if: matrix.arch == 'x86_64'
        id: cross-musl
        shell: actions-shell cross --target x86_64-unknown-linux-musl {0}
        run: *CrossOutput
      - name: verify target architecture
        shell: bash
        env:
          ACTUAL_ARCH: ${{ steps.cross-arm64.outputs.arch || steps.cross-musl.outputs.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
